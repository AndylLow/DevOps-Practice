# server-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flask-server
  template:
    metadata:
      labels:
        app: flask-server
    spec:
      containers:
      - name: web
        image: sansar77/flask-server:latest
        env:
        - name: PORT
          value: "5000"
        ports:
        - containerPort: 5000

---
apiVersion: v1
kind: Service
metadata:
  name: flask-service 
spec:
  type: NodePort
  selector:
    app: flask-server
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000
      nodePort: 30000